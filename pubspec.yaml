name: headshorts
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: ^3.13.2

dependencies:
  brotli: ^0.6.0
  cached_network_image: ^3.4.1
  dart_rss: ^3.0.3
  dio: ^5.11.1
  dio_http2_adapter: ^2.9.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  flutter_widget_from_html_core: ^0.17.4
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  html: ^0.15.7
  html_readability: ^0.1.0
  intl: ^0.19.0
  json_annotation: ^4.12.0
  markdown: ^7.3.1
  package_info_plus: ^10.2.1
  riverpod: any
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  xml: ^6.6.1

# A patched flutter_tts: upstream applies the Kotlin Gradle Plugin itself,
# which Flutter warns about today and will refuse to build tomorrow. The patch
# is one Gradle file; see third_party/flutter_tts/README.md, and delete both
# this block and that directory when upstream ships a migrated release.
dependency_overrides:
  flutter_tts:
    path: third_party/flutter_tts

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/feeds/

  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    # Bundled rather than left to the platform: an Indic headline must be
    # designed, not substituted. See HsType.serifFallback.
    - family: NotoSerifDevanagari
      fonts:
        - asset: assets/fonts/NotoSerifDevanagari.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf

# The launcher icon is the icon family's own vector drawable, converted from
# `specs/design/app-icon/` into `android/app/src/main/res/`: an adaptive icon with
# a monochrome layer for Android 13's themed icons. `flutter_launcher_icons` is
# deliberately not used, because it would replace that vector with rasterised
# PNGs. The legacy PNGs for Android before adaptive icons and the splash art
# below are rendered from the same SVGs.

flutter_native_splash:
  # The pale ground of the icon itself, so the splash reads as the launcher
  # icon holding still rather than as a different screen.
  color: "#FFDDD9"
  color_dark: "#291412"
  image: assets/icon/splash.png
  image_dark: assets/icon/splash_dark.png
  android_12:
    # Android 12 masks its splash icon to a circle and shows only the middle of
    # it, so this art is the glyph alone on transparent and the ground is the
    # colour below. Passing the whole icon here gets it cropped.
    image: assets/icon/splash_android12.png
    image_dark: assets/icon/splash_android12_dark.png
    icon_background_color: "#FFDDD9"
    icon_background_color_dark: "#291412"
    color: "#FFDDD9"
    color_dark: "#291412"
  android: true
  ios: false
  web: false
