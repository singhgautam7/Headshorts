name: headshorts
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  brotli: ^0.6.0
  cached_network_image: ^3.4.1
  dart_rss: ^3.0.3
  dio: ^5.11.1
  dio_http2_adapter: ^2.9.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_widget_from_html_core: ^0.17.4
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  html: ^0.15.7
  html_readability: ^0.1.0
  intl: ^0.19.0
  json_annotation: ^4.12.0
  markdown: ^7.3.1
  package_info_plus: ^10.2.1
  riverpod: any
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/feeds/

  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf

# The mark is the design board's: a column of headlines fading down the page,
# closed by a short accent rule where the feed stops.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  remove_alpha_ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#F4F1EA"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"

# A calm splash consistent with the AMOLED theme: the ground, the mark, and
# nothing that spins.
flutter_native_splash:
  color: "#000000"
  image: "assets/icon/splash.png"
  android_12:
    color: "#000000"
    image: "assets/icon/splash.png"
    icon_background_color: "#F4F1EA"
  android: true
  ios: false
  web: false
